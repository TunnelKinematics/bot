[project]
name = "tv-bot"
version = "0.1.0"
requires-python = ">=3.10,<3.14"  # mujoco-warp has no 3.14 wheels
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
]
# GPU-only, installed from NVIDIA's wheels on the Jetson (see modal_app.py for the x86 URLs):
#   cuvslam       https://github.com/nvidia-isaac/cuVSLAM/releases
#   nvblox_torch  https://github.com/nvidia-isaac/nvblox/releases

[project.optional-dependencies]
oak = ["depthai>=2.24,<3"]
# Pupper locomotion training (training/, vendored mjlab). Needs an NVIDIA GPU;
# macOS can evaluate only. Install with: uv sync --extra training
training = [
    "prettytable",
    "tqdm",
    "tyro>=1.0.1",
    "torch>=2.7.0",
    "torchrunx>=0.3.4",
    "warp-lang>=1.14.0",
    "mujoco-warp>=3.10.0.2,~=3.10.0",
    "mujoco~=3.10.0",
    "trimesh>=4.8.3",
    "scipy>=1.15",
    "viser>=1.0.27",
    "mjviser>=0.0.14",
    "mediapy>=1.2.6",
    # mediapy 1.2.6 breaks on numpy>=2.5 (google/mediapy#66).
    "numpy<2.5",
    "imageio-ffmpeg",
    "tensordict",
    "rsl-rl-lib==5.4.0",
    "tensorboard>=2.20.0",
    "onnxscript>=0.5.4",
    "wandb>=0.22.3",
]

[project.scripts]
train = "mjlab.scripts.train:main"
play = "mjlab.scripts.play:main"
list-envs = "mjlab.scripts.list_envs:main"
export-pupper-policy = "mjlab.scripts.export_pupper_policy:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "onnxruntime>=1.19.0; python_version >= '3.11'",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "training/src"]
include = ["bot*", "mjlab*"]

[tool.setuptools.package-data]
mjlab = ["py.typed", "**/*.xml", "**/*.stl"]

[tool.uv]
constraint-dependencies = ["GitPython>=3.1.49", "lxml>=6.1.0"]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]  # training tests: uv run --extra training pytest training/tests
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = [
    "E501",  # line length is the formatter's job; long comments/strings are ok
    "N806", "N803", "N802",  # T_world_optical, K, ...: math naming
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # argparse before the rest
# mjlab reward/event terms are callable classes named like functions.
"training/src/mjlab/**/mdp/*.py" = ["N801"]
"training/tests/*" = ["N801"]
