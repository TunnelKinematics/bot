name: bot

services:
  dev:
    container_name: bot
    build:
      context: .
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: bot-ros:jazzy
    working_dir: /ws
    volumes:
      - ../ros/src:/ws/src
      - ../dashboard:/ws/dashboard:ro
      - ../scripts:/ws/scripts:ro
      # keep build artifacts out of the host tree
      - build:/ws/build
      - install:/ws/install
      - log:/ws/log
    ports:
      - "8080:8080"   # dashboard
      - "8081:8081"   # camera streams
      - "9090:9090"   # rosbridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    stdin_open: true
    tty: true

volumes:
  build:
  install:
  log:
