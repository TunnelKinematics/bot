name: bot

services:
  bot:
    container_name: bot
    build:
      context: .
      args:
        LIDAR_MODEL: ${LIDAR_MODEL:-l2}
    image: bot:${LIDAR_MODEL:-l2}
    runtime: runc
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ../src:/ws/src:ro
      - /dev:/dev
    device_cgroup_rules:
      - "c 166:* rmw" # ttyACM
      - "c 188:* rmw" # ttyUSB
    command: bash -c "colcon build --symlink-install && . install/setup.bash && exec ros2 launch bot_bringup robot.launch.py"
